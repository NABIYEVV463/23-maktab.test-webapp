<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#17212f;--mute:#5d6a7b;--line:#d9dee5;--brand:#1f3a5f;--bi:#fff;--bad:#b3392b;--sel:#e6edf7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161e;--card:#18212c;--ink:#e8edf3;--mute:#9aa7b7;--line:#2b3746;--brand:#7fa6d8;--bi:#10161e;--bad:#e77c6f;--sel:#223248}}
:root[data-theme="dark"]{--bg:#10161e;--card:#18212c;--ink:#e8edf3;--mute:#9aa7b7;--line:#2b3746;--brand:#7fa6d8;--bi:#10161e;--bad:#e77c6f;--sel:#223248}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hide{display:none!important}
header{background:var(--brand);color:var(--bi);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:600 18px Georgia,serif}
header button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:5px 10px;font:14px system-ui;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px 14px 50px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button{flex:none;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--brand);color:var(--bi);border-color:var(--brand)}
h2{font:600 20px Georgia,serif;margin:6px 0 10px}
h3{font:600 16px Georgia,serif;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand)}
.b{padding:9px 14px;border:0;border-radius:6px;background:var(--brand);color:var(--bi);font:600 14px system-ui;cursor:pointer}
.b.g{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.b.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>input{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.bar{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar i{display:block;height:14px;background:var(--brand);border-radius:3px}
.bar span:last-child{text-align:right}
.chip{display:inline-flex;gap:4px;align-items:center;margin:0 6px 6px 0}
.chip input{width:48px;text-align:center}
.chip button{padding:6px 9px}
.mute{color:var(--mute);font-size:14px}
.err{color:var(--bad);min-height:20px}
.q{padding:8px 0;border-bottom:1px solid var(--line)}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
@media (max-width:600px){.fl,.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>Admin kirishi</h2>
    <label for="lg">Login</label><input id="lg" autocomplete="username">
    <label for="pw" style="margin-top:10px">Parol</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="err"></p>
    <button class="b" id="go" style="width:100%">Kirish</button>
  </div>
</div>

<div id="app" class="hide">
<header><span>Admin panel</span><button id="out">Chiqish</button></header>
<main>
<nav id="nav"></nav>
<div class="fl" id="filters"></div>
<section id="p-res"></section>
<section id="p-tests" class="hide"></section>
<section id="p-subj" class="hide"></section>
<section id="p-cls" class="hide"></section>
</main>
</div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function lab(p){return p>=85?"Aʼlo":p>=75?"Yaxshi":p>=50?"Qoniqarli":p>=35?"Qoniqarsiz":"Yomon"}
var HASH="2113d6c26b67d3621b074000846ad101f3b3b88308f85d33be4843831c2fac74";

/* ---- kirish ---- */
async function login(){
  var h="";
  try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode($("lg").value.trim()+":"+$("pw").value));
    h=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){}
  if(h===HASH){$("login").classList.add("hide");$("app").classList.remove("hide");$("pw").value="";init()}
  else $("err").textContent="Login yoki parol notoʻgʻri.";
}
$("go").onclick=login;
$("pw").onkeydown=function(e){if(e.key==="Enter")login()};
$("out").onclick=function(){$("app").classList.add("hide");$("login").classList.remove("hide");$("err").textContent=""};

/* ---- maʼlumotlar (namuna) ---- */
var D={subjects:["Matematika","Ona tili","Ingliz tili"],classes:{},tests:[],results:[],nid:3};
for(var g=6;g<=11;g++)D.classes[g]=["A","B","D"];
D.tests=[
 {id:1,title:"Kasrlar",grade:6,subject:"Matematika",quarter:1,qs:[{q:"1/2 + 1/2 = ?",o:["1","2","1/4","0"],c:0},{q:"3/4 ning 2 barobari?",o:["3/2","6/8","3/8","1"],c:0}]},
 {id:2,title:"Present Simple",grade:7,subject:"Ingliz tili",quarter:2,qs:[{q:"She ___ school every day.",o:["go","goes","going","gone"],c:1}]}
];
var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
var NM=["Aziz Karimov","Madina Aliyeva","Jasur Toshev","Dilnoza Rahimova","Sardor Umarov","Malika Yusupova","Bekzod Nazarov","Nodira Saidova","Otabek Ismoilov","Zarina Qodirova"];
for(var i=0;i<60;i++){var gg=6+Math.floor(rnd()*6);
 D.results.push({n:NM[Math.floor(rnd()*NM.length)],g:gg,l:D.classes[gg][Math.floor(rnd()*3)],s:D.subjects[Math.floor(rnd()*3)],q:1+Math.floor(rnd()*4),p:Math.round(30+rnd()*70)})}
var F={g:"",s:"",q:""},TAB="res",EDIT=null;

/* ---- umumiy ---- */
function sure(btn,fn){if(btn.dataset.sure){fn()}else{btn.dataset.sure=1;var t=btn.textContent;btn.textContent="Tasdiqlash";setTimeout(function(){delete btn.dataset.sure;btn.textContent=t},3000)}}
function opts(arr,sel,all){return (all?'<option value="">Hammasi</option>':"")+arr.map(function(a){var v=Array.isArray(a)?a[0]:a,t=Array.isArray(a)?a[1]:a;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?" selected":"")+'>'+esc(t)+'</option>'}).join("")}
var GR=[6,7,8,9,10,11].map(function(g){return [g,g+"-sinf"]}),QU=[1,2,3,4].map(function(q){return [q,q+"-chorak"]});
function renderFilters(){
  $("filters").innerHTML='<div><label>Sinf</label><select id="fg">'+opts(GR,F.g,1)+'</select></div><div><label>Fan</label><select id="fs">'+opts(D.subjects,F.s,1)+'</select></div><div><label>Chorak</label><select id="fq">'+opts(QU,F.q,1)+'</select></div>';
  ["g","s","q"].forEach(function(k){$("f"+k).onchange=function(){F[k]=this.value;draw()}});
}
function setTab(t){TAB=t;draw()}
function drawNav(){
  var T=[["res","Natijalar"],["tests","Testlar"],["subj","Fanlar"],["cls","Sinflar"]];
  $("nav").innerHTML=T.map(function(x){return '<button class="'+(TAB===x[0]?"on":"")+'" data-t="'+x[0]+'">'+x[1]+'</button>'}).join("");
  Array.prototype.forEach.call($("nav").children,function(b){b.onclick=function(){EDIT=null;setTab(this.dataset.t)}});
}
function draw(){
  drawNav();
  ["res","tests","subj","cls"].forEach(function(t){$("p-"+t).classList.toggle("hide",t!==TAB)});
  $("filters").classList.toggle("hide",TAB!=="res"&&TAB!=="tests");
  if(TAB==="res"||TAB==="tests")renderFilters();
  ({res:rRes,tests:rTests,subj:rSubj,cls:rCls})[TAB]();
}
function init(){TAB="res";EDIT=null;draw()}

/* ---- natijalar ---- */
function fres(){return D.results.filter(function(r){return (!F.g||r.g==F.g)&&(!F.s||r.s===F.s)&&(!F.q||r.q==F.q)})}
function bars(title,list,key,fmt){
  var m={};list.forEach(function(r){var k=r[key];(m[k]=m[k]||[]).push(r.p)});
  var ks=Object.keys(m).sort(function(a,b){return a>b?1:-1});
  return '<div class="card"><h3>'+title+'</h3>'+(ks.length?ks.map(function(k){var a=Math.round(m[k].reduce(function(x,y){return x+y},0)/m[k].length);
   return '<div class="bar"><span>'+esc(fmt(k))+'</span><span><i style="width:'+a+'%"></i></span><span>'+a+'%</span></div>'}).join(""):'<p class="mute">Maʼlumot yoʻq</p>')+'</div>';
}
function rRes(){
  var L=fres();
  $("p-res").innerHTML='<h2>Natijalar</h2><p class="mute">Jami: '+L.length+' ta natija. Oʻrtacha ball: '+(L.length?Math.round(L.reduce(function(a,r){return a+r.p},0)/L.length):0)+'%</p>'+
  '<div class="g2">'+bars("Sinflar boʻyicha (oʻrtacha)",L,"g",function(k){return k+"-sinf"})+bars("Fanlar boʻyicha (oʻrtacha)",L,"s",function(k){return k})+'</div>'+
  bars("Choraklar boʻyicha (oʻrtacha)",L,"q",function(k){return k+"-chorak"})+
  '<div class="card tw"><table><tr><th>Oʻquvchi</th><th>Sinf</th><th>Fan</th><th>Chorak</th><th>Ball</th><th>Baho</th></tr>'+
  L.slice(0,100).map(function(r){return '<tr><td>'+esc(r.n)+'</td><td>'+r.g+"-"+esc(r.l)+'</td><td>'+esc(r.s)+'</td><td>'+r.q+'</td><td>'+r.p+'%</td><td>'+lab(r.p)+'</td></tr>'}).join("")+'</table></div>';
}

/* ---- fanlar ---- */
function rSubj(){
  $("p-subj").innerHTML='<h2>Fanlar</h2><div class="card">'+D.subjects.map(function(s,i){
   return '<div class="row"><input value="'+esc(s)+'" data-i="'+i+'" class="sn"><button class="b d sd" data-i="'+i+'">Oʻchirish</button></div>'}).join("")+
   '</div><div class="card"><h3>Yangi fan</h3><div class="row"><input id="ns" placeholder="Fan nomi"><button class="b" id="as">Qoʻshish</button></div></div>';
  Array.prototype.forEach.call(document.querySelectorAll(".sn"),function(el){el.onchange=function(){
    var i=+this.dataset.i,o=D.subjects[i],n=this.value.trim();if(!n){this.value=o;return}
    D.subjects[i]=n;D.tests.forEach(function(t){if(t.subject===o)t.subject=n});D.results.forEach(function(r){if(r.s===o)r.s=n})}});
  Array.prototype.forEach.call(document.querySelectorAll(".sd"),function(el){el.onclick=function(){var i=+this.dataset.i;sure(this,function(){D.subjects.splice(i,1);rSubj()})}});
  $("as").onclick=function(){var v=$("ns").value.trim();if(v&&D.subjects.indexOf(v)<0){D.subjects.push(v);rSubj()}};
}

/* ---- sinflar ---- */
function rCls(){
  $("p-cls").innerHTML='<h2>Sinflar va harflar</h2>'+[6,7,8,9,10,11].map(function(g){
   return '<div class="card"><h3>'+g+'-sinf</h3>'+D.classes[g].map(function(l,i){return '<span class="chip"><input class="cl" maxlength="2" value="'+esc(l)+'" data-g="'+g+'" data-i="'+i+'"><button class="b d cd" data-g="'+g+'" data-i="'+i+'">×</button></span>'}).join("")+
   '<span class="chip"><input id="nl'+g+'" maxlength="2" placeholder="Harf"><button class="b ca" data-g="'+g+'">+</button></span></div>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".cl"),function(el){el.onchange=function(){var v=this.value.trim().toUpperCase();if(v)D.classes[this.dataset.g][this.dataset.i]=v;else this.value=D.classes[this.dataset.g][this.dataset.i]}});
  Array.prototype.forEach.call(document.querySelectorAll(".cd"),function(el){el.onclick=function(){var g=this.dataset.g,i=+this.dataset.i;sure(this,function(){D.classes[g].splice(i,1);rCls()})}});
  Array.prototype.forEach.call(document.querySelectorAll(".ca"),function(el){el.onclick=function(){var g=this.dataset.g,v=$("nl"+g).value.trim().toUpperCase();if(v&&D.classes[g].indexOf(v)<0){D.classes[g].push(v);rCls()}}});
}

/* ---- testlar ---- */
function ftests(){return D.tests.filter(function(t){return (!F.g||t.grade==F.g)&&(!F.s||t.subject===F.s)&&(!F.q||t.quarter==F.q)})}
function rTests(){
  if(EDIT!==null)return rEdit();
  $("p-tests").innerHTML='<h2>Testlar</h2><div class="card"><h3>Yangi test</h3><div class="g4"><div><label>Nomi</label><input id="tt"></div><div><label>Sinf</label><select id="tg">'+opts(GR,6)+'</select></div><div><label>Fan</label><select id="ts">'+opts(D.subjects,"")+'</select></div><div><label>Chorak</label><select id="tq">'+opts(QU,1)+'</select></div></div><button class="b" id="nt">Test yaratish</button></div>'+
  '<div class="card">'+(ftests().length?ftests().map(function(t){return '<div class="q"><b>'+esc(t.title)+'</b><div class="mute">'+t.grade+'-sinf · '+esc(t.subject)+' · '+t.quarter+'-chorak · '+t.qs.length+' ta savol</div><div class="row" style="margin:6px 0 0"><button class="b g oe" data-id="'+t.id+'">Ochish</button><button class="b d od" data-id="'+t.id+'">Oʻchirish</button></div></div>'}).join(""):'<p class="mute">Test topilmadi.</p>')+'</div>';
  $("nt").onclick=function(){var n=$("tt").value.trim();if(!n){$("tt").focus();return}
    D.tests.push({id:D.nid++,title:n,grade:+$("tg").value,subject:$("ts").value,quarter:+$("tq").value,qs:[]});EDIT=D.nid-1;rTests()};
  Array.prototype.forEach.call(document.querySelectorAll(".oe"),function(el){el.onclick=function(){EDIT=+this.dataset.id;rTests()}});
  Array.prototype.forEach.call(document.querySelectorAll(".od"),function(el){el.onclick=function(){var id=+this.dataset.id;sure(this,function(){D.tests=D.tests.filter(function(t){return t.id!==id});rTests()})}});
}
function rEdit(){
  var t=D.tests.filter(function(x){return x.id===EDIT})[0];if(!t){EDIT=null;return rTests()}
  $("p-tests").innerHTML='<button class="b g" id="bk">‹ Testlar</button><h2 style="margin-top:12px">Testni tahrirlash</h2>'+
  '<div class="card"><div class="g4"><div><label>Nomi</label><input id="et" value="'+esc(t.title)+'"></div><div><label>Sinf</label><select id="eg">'+opts(GR,t.grade)+'</select></div><div><label>Fan</label><select id="es">'+opts(D.subjects,t.subject)+'</select></div><div><label>Chorak</label><select id="eq">'+opts(QU,t.quarter)+'</select></div></div></div>'+
  '<div class="card"><h3>Savol qoʻshish</h3><label>Savol</label><textarea id="qq" rows="2"></textarea><div class="g2" style="margin-top:8px">'+["A","B","C","D"].map(function(l){return '<div><label>'+l+'</label><input class="qo"></div>'}).join("")+'</div><div class="row" style="margin-top:8px"><select id="qc">'+opts(["A","B","C","D"],"A")+'</select><button class="b" id="aq">Qoʻshish</button></div></div>'+
  '<div class="card"><h3>Fayldan yuklash</h3><p class="mute">Word (.docx), Excel/CSV: savol, A, B, C, D, toʻgʻri javob (A–D) ustunlari. Word matnida: “1. Savol”, “A) variant”, toʻgʻri variant oxirida *. PDF keyingi qadamda ulanadi.</p><input type="file" id="fi" accept=".docx,.csv,.xlsx,.xls,.txt"><p id="fm" class="mute"></p></div>'+
  '<div class="card"><h3>Savollar ('+t.qs.length+')</h3>'+t.qs.map(function(q,i){return '<div class="q"><b>'+(i+1)+'. '+esc(q.q)+'</b><div class="mute">'+q.o.map(function(o,j){return "ABCDEF"[j]+") "+esc(o)+(j===q.c?" ✓":"")}).join("  ")+'</div><button class="b d qd" data-i="'+i+'" style="margin-top:6px">Oʻchirish</button></div>'}).join("")+'</div>';
  $("bk").onclick=function(){EDIT=null;rTests()};
  [["et","title"],["eg","grade"],["es","subject"],["eq","quarter"]].forEach(function(p){$(p[0]).onchange=function(){var v=this.value.trim();if(p[1]==="grade"||p[1]==="quarter")v=+v;if(v!=="")t[p[1]]=v}});
  $("aq").onclick=function(){var q=$("qq").value.trim(),o=Array.prototype.map.call(document.querySelectorAll(".qo"),function(e){return e.value.trim()}).filter(Boolean);
    if(!q||o.length<2){$("qq").focus();return}t.qs.push({q:q,o:o,c:Math.min("ABCD".indexOf($("qc").value),o.length-1)});rEdit()};
  Array.prototype.forEach.call(document.querySelectorAll(".qd"),function(el){el.onclick=function(){var i=+this.dataset.i;sure(this,function(){t.qs.splice(i,1);rEdit()})}});
  $("fi").onchange=function(){importFile(this.files[0],t)};
}

/* ---- fayl import ---- */
function done(t,list,msg){if(list.length){list.forEach(function(q){t.qs.push(q)});rEdit();$("fm").textContent=list.length+" ta savol qoʻshildi."}else $("fm").textContent=msg||"Savol topilmadi. Formatni tekshiring."}
function parseText(txt){
  var out=[],cur=null;
  txt.split(/\r?\n/).forEach(function(line){line=line.trim();if(!line)return;var m;
    if((m=line.match(/^([A-F])[\.\)]\s*(.+)$/))&&cur){var star=/\*\s*$/.test(m[2]);cur.o.push(m[2].replace(/\*\s*$/,"").trim());if(star)cur.c=cur.o.length-1}
    else if((m=line.match(/^(javob|answer|toʻgʻri)\s*[:\-]\s*([A-F])/i))&&cur){cur.c="ABCDEF".indexOf(m[2].toUpperCase())}
    else if((m=line.match(/^\d+[\.\)]\s*(.+)$/))){cur={q:m[1],o:[],c:0};out.push(cur)}
  });
  return out.filter(function(q){return q.o.length>=2});
}
function importFile(f,t){
  if(!f)return;var n=f.name.toLowerCase(),r=new FileReader();$("fm").textContent="Oʻqilmoqda…";
  r.onerror=function(){$("fm").textContent="Faylni oʻqib boʻlmadi."};
  if(/\.(csv|xlsx|xls)$/.test(n)){
    if(typeof XLSX==="undefined"){$("fm").textContent="Excel kutubxonasi yuklanmadi.";return}
    r.onload=function(){try{var wb=XLSX.read(r.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}),list=[];
      rows.forEach(function(w,i){if(!w[0]||(i===0&&/savol/i.test(String(w[0]))))return;var o=[w[1],w[2],w[3],w[4]].map(function(x){return String(x).trim()}).filter(Boolean);
        var c=String(w[5]).trim().toUpperCase();c=/^[A-F]$/.test(c)?"ABCDEF".indexOf(c):(parseInt(c,10)-1||0);if(o.length>=2)list.push({q:String(w[0]).trim(),o:o,c:Math.max(0,Math.min(c,o.length-1))})});
      done(t,list)}catch(e){$("fm").textContent="Faylni oʻqib boʻlmadi."}};r.readAsArrayBuffer(f);
  }else if(/\.docx$/.test(n)){
    if(typeof mammoth==="undefined"){$("fm").textContent="Word kutubxonasi yuklanmadi.";return}
    r.onload=function(){mammoth.extractRawText({arrayBuffer:r.result}).then(function(x){done(t,parseText(x.value))}).catch(function(){$("fm").textContent="Faylni oʻqib boʻlmadi."})};r.readAsArrayBuffer(f);
  }else{r.onload=function(){done(t,parseText(r.result))};r.readAsText(f)}
}
</script>
</body>
</html>
